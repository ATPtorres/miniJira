databases:
  - name: minijira-db
    databaseName: minijira
    user: minijira
    plan: free
    region: oregon

services:
  - type: web
    name: minijira
    runtime: docker
    plan: free
    region: oregon
    branch: PostgreSQL-Migration
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    autoDeploy: true
    envVars:
      - key: SISTEMA_APP_URL
        sync: false
      - key: SISTEMA_APP_SECRET
        generateValue: true
      - key: SISTEMA_ENCRYPTION_KEY
        generateValue: true
      - key: SISTEMA_EMAIL_LOOKUP_KEY
        generateValue: true
      - key: SISTEMA_DB_HOST
        fromDatabase:
          name: minijira-db
          property: host
      - key: SISTEMA_DB_PORT
        fromDatabase:
          name: minijira-db
          property: port
      - key: SISTEMA_DB_DATABASE
        fromDatabase:
          name: minijira-db
          property: database
      - key: SISTEMA_DB_USERNAME
        fromDatabase:
          name: minijira-db
          property: user
      - key: SISTEMA_DB_PASSWORD
        fromDatabase:
          name: minijira-db
          property: password
      - key: SISTEMA_DB_SSLMODE
        value: require
      - key: SISTEMA_TIMEZONE
        value: America/La_Paz
